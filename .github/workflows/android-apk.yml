name: Android APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: unzip -o -q android-app.zip
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build APK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          cd android-app
          npm ci
          npx cap sync android
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/Sumerians.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sumerians-apk
          path: Sumerians.apk
